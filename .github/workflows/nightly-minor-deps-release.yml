# Nightly dependency refresh → patch release (main).
#
# Raises package.json ranges to the newest in-major release via npm-check-updates
# (`--target semver`). Versions published in the last COOLDOWN_DAYS days are
# skipped so a hijacked release has time to be yanked.
#
# package.json is the only file ncu edits on purpose; the lockfile is then
# re-resolved for changed specifiers only (`pnpm/npm install`).


name: Nightly minor deps release

on:
  schedule:
    - cron: '17 14 * * *' # ~00:17 AEST
  workflow_dispatch:

concurrency:
  group: nightly-minor-deps-${{ github.repository }}
  cancel-in-progress: false

env:
  NCU_VERSION: 23.1.1
  COOLDOWN_DAYS: 3

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Raise package.json ranges (same major)
        run: |
          set -euo pipefail
          npx --yes "npm-check-updates@${{ env.NCU_VERSION }}" \
            --target semver \
            --cooldown "${{ env.COOLDOWN_DAYS }}" \
            --upgrade

      - name: Detect package.json changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependencies already at the newest in-major release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- package.json
          fi

      - name: Sync lockfile to package.json
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Lint (if present)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if pnpm run | grep -qE '^  lint'; then
            pnpm run lint
          else
            echo "No lint script; skipping."
          fi

      - name: Test (if present)
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if pnpm run | grep -qE '^  test'; then
            pnpm test
          else
            echo "No test script; skipping."
          fi

      # pnpm version requires a clean tree; lockfile is already dirty from pnpm update.
      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          NEW_VERSION="$(node -p "
            const [maj, min, pat] = process.argv[1].split('.').map(Number);
            [maj, min, pat + 1].join('.')
          " "$CURRENT")"
          pnpm pkg set "version=${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Commit dependency bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): nightly in-major dependency update (${{ steps.version.outputs.version }})"
          git push origin HEAD:dev

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target dev --title "$TAG" --notes "Nightly in-major dependency update (${TAG})."

      - name: Set up QEMU
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
