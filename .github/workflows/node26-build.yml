name: Node 26 build

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: node26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image on Node 26
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=node26-${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=node26-${{ matrix.dockerfile }}
